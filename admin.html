<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Admin - Farm Wars</title></head>
<body style="font-family:system-ui;padding:20px">
<h1>Admin Panel</h1>
Key: <input id="key" value="admin73"><button onclick="load()">Load</button>
<div>
<h3>A-Ads Control</h3>
<label><input type="checkbox" id="aads"> Enable A-Ads</label>
<h3>Adsgram Block ID</h3>
<input id="adsgram" placeholder="YOUR_ADSGRAM_BLOCK_ID" style="width:300px">
<h3>Add Task</h3>
<input id="ten" placeholder="Title EN"><input id="tar" placeholder="Title AR"><input id="link" placeholder="Link"><input id="reward" placeholder="0.05"><button onclick="addTask()">Add</button>
<br><br><button onclick="save()">Save Settings</button>
<pre id="out"></pre>
</div>
<script>
async function load(){
  const k=document.getElementById('key').value;
  const r=await fetch(`/api/admin/stats?key=${k}`); document.getElementById('out').innerText=await r.text();
  const s=await fetch(`/api/game?key=${k}`); const d=await s.json();
  document.getElementById('aads').checked = d.settings.find(x=>x.key==='a_ads_enabled')?.value==='true';
  document.getElementById('adsgram').value = d.settings.find(x=>x.key==='adsgram_block_id')?.value||'';
}
async function save(){
  const k=document.getElementById('key').value;
  await fetch(`/api/admin/settings?key=${k}`,{method:'POST',body:JSON.stringify({a_ads_enabled: document.getElementById('aads').checked, adsgram_block_id: document.getElementById('adsgram').value})});
  alert('saved');
}
async function addTask(){
  const k=document.getElementById('key').value;
  await fetch(`/api/admin/tasks?key=${k}`,{method:'POST',body:JSON.stringify({title_en:ten.value,title_ar:tar.value,link:link.value,reward:parseFloat(reward.value),type:'subscribe'})});
  alert('task added');
}
</script>
</body></html>
