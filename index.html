<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Wars</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<style>
body{font-family:system-ui;background:#0f1a12;color:#fff;margin:0;padding:16px}
.plot{width:80px;height:80px;background:#2d4a22;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin:6px;cursor:pointer}
#wallet{position:fixed;top:10px;right:10px}
</style>
</head>
<body>
<div id="wallet"></div>
<h1 id="title">Farm Wars</h1>
<p id="subtitle">Plant, harvest & steal farms!</p>
<div id="farm"></div>
<button id="protectBtn">Protect 4h</button>
<div id="tasks"></div>
<!-- A-Ads hidden frame -->
<iframe id="aads-frame" style="display:none;width:0;height:0;border:0"></iframe>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
const user = tg.initDataUnsafe?.user;
const lang = user?.language_code === 'ar' ? 'ar' : 'en';
const t = {
  en:{title:"Farm Wars", sub:"Plant, harvest & steal farms!", protect:"Protect 4h", plant:"Plant", harvest:"Harvest"},
  ar:{title:"حرب المزارع", sub:"ازرع، احصد، واسرق مزارع أصحابك!", protect:"حماية 4 ساعات", plant:"ازرع", harvest:"احصد"}
};
document.getElementById('title').innerText = t[lang].title;
document.getElementById('subtitle').innerText = t[lang].sub;
document.getElementById('protectBtn').innerText = t[lang].protect;

// TON Connect - Owner wallet gets 20%
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl: window.location.origin + '/tonconnect-manifest.json',
  buttonRootId: 'wallet'
});

// Adsgram - REPLACE WITH YOUR BLOCK ID AFTER DEPLOY
const AdController = window.Adsgram?.init({ blockId: "YOUR_ADSGRAM_BLOCK_ID" });

function showAdAndDo(fn){
  if(AdController){ AdController.show().then(()=>fn()).catch(()=>fn()); } else { fn(); }
}

// Load game
async function load(){
  const res = await fetch(`/api/game?user_id=${user?.id||1}&username=${user?.username||'player'}&lang=${lang}`);
  const data = await res.json();
  const farm = document.getElementById('farm');
  farm.innerHTML='';
  for(let i=0;i<6;i++){
    const p = data.plots.find(x=>x.plot_id===i);
    const div=document.createElement('div'); div.className='plot';
    div.innerText = p ? '🌱' : '🟫';
    div.onclick = ()=> showAdAndDo(()=>{
      if(!p) fetch('/api/action',{method:'POST',body:JSON.stringify({type:'plant',plot_id:i,crop:'wheat'})}).then(load);
      else fetch('/api/action',{method:'POST',body:JSON.stringify({type:'harvest',plot_id:i})}).then(load);
      // hidden A-Ads load
      if(data.settings.find(s=>s.key==='a_ads_enabled')?.value==='true'){
        document.getElementById('aads-frame').src='//YOUR_A-ADS_ID';
      }
    });
    farm.appendChild(div);
  }
}
load();

document.getElementById('protectBtn').onclick=()=> showAdAndDo(()=>{
  fetch('/api/action',{method:'POST',body:JSON.stringify({type:'protect'})});
});

// manifest for TON
</script>
</body>
</html>
